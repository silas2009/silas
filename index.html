<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ufoegbune Silas Oliseloke — silas.exes</title>
<meta name="description" content="Ufoegbune Silas Oliseloke — ICT student, self-taught developer, founder of Silas Edge (graphic design & digital marketing).">
<meta name="google-site-verification" content="1CqMyaHjBFaVHoNaAsZBhbisGy5V53bAlVTcp1QNwHY" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1512;
    --surface: #161F1B;
    --surface-2: #1D2822;
    --line: #2A3730;
    --text: #F2EFE6;
    --muted: #8FA096;
    --amber: #FFB238;
    --blue: #6FB3DE;
    --radius: 14px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity:0.06;
    pointer-events:none;
    z-index:0;
  }

  /* LAYOUT */
  .app{
    display:flex;
    min-height:100vh;
    position:relative; z-index:1;
  }

  /* SIDEBAR */
  .sidebar{
    width:230px;
    flex-shrink:0;
    border-right:1px solid var(--line);
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brandmark{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--amber);
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
    padding:0 10px;
  }
  .brandmark .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px var(--amber);
    animation:blink 2.4s infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .sidebar .who{
    font-size:12px;
    color:var(--muted);
    padding:0 10px 20px;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
  .navbtn{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    text-align:left;
    background:transparent;
    border:none;
    color:var(--muted);
    padding:11px 10px;
    border-radius:8px;
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
    transition:background .15s, color .15s;
    width:100%;
  }
  .navbtn:hover{ background:var(--surface); color:var(--text); }
  .navbtn.active{ background:var(--surface-2); color:var(--amber); }
  .navbtn .idx{ opacity:0.5; font-size:11px; }
  .sidebar-foot{
    margin-top:auto;
    padding:12px 10px 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    border-top:1px solid var(--line);
  }

  /* CONTENT */
  .content-wrap{
    flex:1;
    min-width:0;
    padding:40px 5vw 80px;
  }
  .content-inner{
    max-width:760px;
    margin:0 auto;
    animation:fadein .35s ease;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .loading{
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:40px 0;
  }

  /* MOBILE TOPBAR */
  .mobile-topbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0;
    background:var(--bg);
    z-index:5;
  }
  .menu-toggle{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    width:36px; height:36px;
    border-radius:8px;
    font-size:16px;
  }

  /* SHARED CONTENT STYLES (used inside fetched sections) */
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(30px, 5vw, 46px);
    line-height:1.1;
    letter-spacing:-0.01em;
  }
  h1 .handle{ color:var(--amber); }
  h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:24px;
    font-weight:600;
  }
  h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
  }
  .tagline{ margin-top:16px; font-size:17px; color:var(--muted); max-width:50ch; }
  .lead{ color:var(--muted); max-width:60ch; margin-bottom:24px; }
  .section-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:22px; }
  .section-num{ font-family:'IBM Plex Mono', monospace; color:var(--amber); font-size:13px; }

  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:11px 18px;
    border-radius:8px;
    border:1px solid var(--line);
    display:inline-flex; align-items:center; gap:8px;
    transition:border-color .2s, transform .2s;
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }
  .btn:hover{ border-color:var(--amber); transform:translateY(-1px); }
  .btn.primary{ background:var(--amber); color:#12180F; border-color:var(--amber); font-weight:600; }
  .btn.primary:hover{ background:#ffc35e; }
  .hero-cta{ margin-top:28px; display:flex; gap:12px; flex-wrap:wrap; }

  .hero{ display:grid; grid-template-columns: 1.15fr 0.85fr; gap:40px; align-items:center; padding-bottom:20px; }
  .photo-frame{ border:1px solid var(--line); border-radius:var(--radius); padding:10px; background:var(--surface); }
  .photo-frame img{ width:100%; display:block; border-radius:8px; filter:grayscale(15%) contrast(1.03); }
  .photo-tag{ margin-top:10px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }

  .spec{ margin:28px 0 20px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); overflow:hidden; }
  .spec-head{ padding:14px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); }
  .spec-body{ display:grid; grid-template-columns: repeat(2, 1fr); }
  .spec-row{ padding:16px 20px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
  .spec-row:nth-child(even){ border-right:none; }
  .spec-row .k{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
  .spec-row .v{ font-size:15px; }

  section{ padding:8px 0 36px; }

  .grid-3{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
  .card{ border:1px solid var(--line); border-radius:var(--radius); padding:20px; background:var(--surface); transition:border-color .2s; }
  .card:hover{ border-color:var(--blue); }
  .card p{ color:var(--muted); font-size:14px; margin-top:6px; }

  .links-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .link-card{ border:1px solid var(--line); border-radius:10px; padding:16px 18px; background:var(--surface); display:flex; justify-content:space-between; align-items:center; transition:border-color .2s, background .2s; }
  .link-card:hover{ border-color:var(--amber); background:var(--surface-2); }
  .link-card .name{ font-weight:600; font-size:14px; }
  .link-card .handle{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); }
  .link-card .arrow{ color:var(--amber); font-family:'IBM Plex Mono', monospace; }

  .contact-panel{ border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .contact-panel .label{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .contact-panel .value{ font-size:20px; font-weight:600; font-family:'Space Grotesk', sans-serif; }

  /* TIMELINE (My Story) */
  .timeline{ position:relative; margin-top:20px; padding-left:28px; border-left:1px solid var(--line); }
  .tl-item{ position:relative; margin-bottom:44px; }
  .tl-item::before{
    content:"";
    position:absolute; left:-33px; top:4px;
    width:11px; height:11px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 4px var(--bg), 0 0 0 5px var(--line);
  }
  .tl-tag{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--amber); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }
  .tl-photo{ border:1px solid var(--line); border-radius:var(--radius); padding:8px; background:var(--surface); max-width:260px; margin:12px 0; }
  .tl-photo img{ width:100%; display:block; border-radius:8px; }
  .tl-text{ color:var(--muted); max-width:55ch; }
  .tl-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:18px; margin-bottom:6px; }

  /* SKILLS */
  .tag-cloud{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--surface);
    color:var(--muted);
  }
  .tag.on{ border-color:var(--amber); color:var(--amber); }

  @media (max-width: 760px){
    .hero{ grid-template-columns:1fr; }
    .hero-photo{ order:-1; max-width:280px; margin:0 auto; }
    .spec-body{ grid-template-columns:1fr; }
    .spec-row:nth-child(even){ border-right:1px solid var(--line); }
    .grid-3{ grid-template-columns:1fr; }
    .links-grid{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width: 460px){
    .links-grid{ grid-template-columns:1fr; }
  }

  @media (max-width: 820px){
    .app{ flex-direction:column; }
    .sidebar{
      position:fixed;
      left:0; top:0; bottom:0;
      z-index:20;
      background:var(--bg);
      transform:translateX(-100%);
      transition:transform .25s ease;
      width:250px;
      height:100vh;
    }
    .sidebar.open{ transform:translateX(0); box-shadow:20px 0 40px rgba(0,0,0,0.4); }
    .mobile-topbar{ display:flex; }
    .content-wrap{ padding:28px 20px 60px; }
    .overlay{
      display:none;
      position:fixed; inset:0;
      background:rgba(0,0,0,0.5);
      z-index:15;
    }
    .overlay.show{ display:block; }
  }
</style>
</head>
<body>

<div class="mobile-topbar">
  <div class="brandmark"><span class="dot"></span> silas.exes</div>
  <button class="menu-toggle" id="menuToggle">☰</button>
</div>
<div class="overlay" id="overlay"></div>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brandmark"><span class="dot"></span> silas.exes</div>
    <div class="who">Ufoegbune Silas Oliseloke<br>ICT student · Silas Edge</div>

    <button class="navbtn" data-section="home"><span class="idx">01</span> Home</button>
    <button class="navbtn" data-section="story"><span class="idx">02</span> My Story</button>
    <button class="navbtn" data-section="projects"><span class="idx">03</span> Projects</button>
    <button class="navbtn" data-section="skills"><span class="idx">04</span> Skills</button>
    <button class="navbtn" data-section="contact"><span class="idx">05</span> Contact</button>

    <div class="sidebar-foot">© 2026 Ufoegbune Silas Oliseloke<br>Ilesa / Abeokuta, NG</div>
  </nav>

  <main class="content-wrap">
    <div class="content-inner" id="content">
      <div class="loading">loading...</div>
    </div>
  </main>
</div>

<script>
  const buttons = document.querySelectorAll('.navbtn');
  const content = document.getElementById('content');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuToggle = document.getElementById('menuToggle');

  async function loadSection(name){
    content.innerHTML = '<div class="loading">loading...</div>';
    try{
      const res = await fetch(name + '.html');
      const html = await res.text();
      content.innerHTML = html;
    }catch(e){
      content.innerHTML = '<div class="loading">Could not load this section.</div>';
    }
    buttons.forEach(b => b.classList.toggle('active', b.dataset.section === name));
    window.location.hash = name;
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    window.scrollTo(0,0);
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => loadSection(btn.dataset.section));
  });

  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });

  const startSection = window.location.hash ? window.location.hash.replace('#','') : 'home';
  loadSection(startSection);
</script>

</body>
</html>
